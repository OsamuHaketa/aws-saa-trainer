# EC2 の図解
# スキーマ: lib/schema/guide.ts / 検証: npm run validate
# status: draft は未確認。公式ドキュメントで確認したら reviewed にして lastVerified を付ける

service: ec2
lead: AWS の仮想サーバー。AMI（OS のテンプレート）から起動し、インスタンスタイプで CPU とメモリを選び、ディスクは EBS かインスタンスストアを使う
decisions:
  - 使い方と期間から、購入オプション（オンデマンド・Savings Plans・RI・スポット）を選ぶ
  - 処理の特徴から、インスタンスファミリーを選ぶ
  - 通信の速さと障害の影響範囲から、プレイスメントグループを選ぶ
  - データを残す必要があるかで、EBS とインスタンスストアを使い分ける
sections:
  - title: インスタンスを構成するもの
    body: インスタンスは 1 つの AZ の中で動く。EBS はネットワーク越しにつながる永続的なディスクで、インスタンスストアはホストに直接付いた一時的なディスク。
    diagram:
      type: architecture
      cols: 6
      rows: 3
      groups:
        - label: AZ a
          kind: az
          at: [1.5, 0, 4.5, 3]
        - label: ホスト（物理サーバー）
          kind: generic
          at: [1.7, 0.6, 2.4, 2.2]
      nodes:
        - id: ami
          label: AMI
          icon: g-disk
          atom: ec2-ami
          at: [0, 0.3]
        - id: role
          label: IAM ロール
          icon: iam-role
          atom: iam-instance-profile
          at: [0, 1.9]
        - id: ec2
          label: EC2 インスタンス
          icon: instance
          at: [2.2, 1.3]
        - id: store
          label: インスタンスストア
          icon: g-disk
          atom: ec2-instance-store
          at: [3.2, 1.3]
        - id: ebs
          label: EBS ボリューム
          icon: ebs
          atom: ec2-ebs-volume
          at: [5, 0.6]
        - id: snap
          label: "スナップショット\n（S3 に保存）"
          icon: s3
          atom: ebs-snapshots
          at: [5, 2]
      edges:
        - { from: ami, to: ec2, label: 起動 }
        - { from: role, to: ec2, label: インスタンスプロファイル, dashed: true }
        - { from: ec2, to: store }
        - { from: ec2, to: ebs, label: ネットワーク }
        - { from: ebs, to: snap }
      caption: 図のアイコンをタップすると、その用語のカードに移動する
    points:
      - EBS は同じ AZ のインスタンスにしか付けられない。別の AZ へはスナップショットから復元する
      - インスタンスストアのデータは、停止・終了やハードウェアの故障で消える（再起動では消えない）
      - アプリに AWS の認証情報を渡すときは、アクセスキーを置かずに IAM ロール（インスタンスプロファイル）を使う

  - title: 購入オプション
    diagram:
      type: table
      columns:
        - { label: オンデマンド, atom: ec2-on-demand, icon: instance }
        - { label: Savings Plans, atom: ec2-savings-plans, icon: savingsplans }
        - { label: リザーブドインスタンス, atom: ec2-reserved-instances, icon: instances }
        - { label: スポット, atom: ec2-spot-instances, icon: spot }
        - { label: Dedicated Hosts, atom: ec2-dedicated-hosts, icon: g-server }
      rows:
        - label: 約束
          cells: [なし, 1 時間あたりの金額を 1 年 / 3 年, インスタンスを 1 年 / 3 年, なし, ホストを専有（オンデマンドか予約）]
        - label: 割引
          cells:
            - なし
            - { text: 最大 72%, tone: good }
            - { text: 最大 72%, tone: good }
            - { text: 最大 90%, tone: good }
            - 割高
        - label: 中断
          cells:
            - { text: されない, tone: good }
            - { text: されない, tone: good }
            - { text: されない, tone: good }
            - { text: 2 分前の通知で中断される, tone: bad }
            - { text: されない, tone: good }
        - label: 向いている使い方
          cells: [短期・予測できない・中断できない, 継続して使うが、タイプやリージョンを変えるかもしれない, 構成が決まっていて継続して使う, 中断されても再実行できる処理, ソケット・コア単位のライセンス（BYOL）]
    points:
      - Compute Savings Plans はファミリー・リージョン・OS が変わっても効き、Fargate と Lambda にも使える
      - スタンダード RI はファミリーを変えられない。コンバーティブル RI は変えられる代わりに割引が小さい
      - 特定の AZ で確実に起動できる枠だけが欲しいなら、オンデマンドキャパシティ予約（割引はない）

  - title: 購入オプションの判断フロー
    diagram:
      type: decision
      tree:
        question: 処理が途中で止まってもよい？
        branches:
          - when: 止まっても再実行できる（バッチ・CI・分析）
            atom: ec2-spot-instances
          - when: 止まっては困る
            next:
              question: どのくらいの期間、使い続ける？
              branches:
                - when: 短期・いつまで使うか分からない
                  atom: ec2-on-demand
                - when: 1 年以上、インスタンスの構成を変えるかもしれない
                  atom: ec2-savings-plans
                - when: 1 年以上、同じ構成で使い続ける
                  atom: ec2-reserved-instances
          - when: 物理サーバー単位のライセンスや規制がある
            next:
              question: ソケットやコアが見える必要がある？
              branches:
                - when: ある（BYOL）
                  atom: ec2-dedicated-hosts
                - when: ない。他の顧客とハードウェアを共有しなければよい
                  atom: ec2-dedicated-instances

  - title: インスタンスファミリー
    diagram:
      type: table
      columns:
        - { label: 汎用, atom: ec2-instance-families }
        - { label: コンピューティング最適化, atom: ec2-instance-families }
        - { label: メモリ最適化, atom: ec2-instance-families }
        - { label: ストレージ最適化, atom: ec2-instance-families }
        - { label: 高速コンピューティング, atom: ec2-instance-families }
      rows:
        - label: 例
          cells: [M・T, C, R・X, I・D, P・G・Inf・Trn]
        - label: 強み
          cells: [バランス, CPU, メモリの量, ローカルディスクの速さ, GPU・専用チップ]
        - label: 向いている処理
          cells: [Web サーバー・一般的なアプリ, バッチ・ゲームサーバー・HPC, インメモリ DB・大規模なデータ処理, 高 IOPS の DB・分散ファイルシステム, 機械学習・画像処理]
    points:
      - T 系（バーストパフォーマンス）は普段は低い CPU で動き、CPU クレジットを使って一時的に性能を上げる

  - title: プレイスメントグループ
    diagram:
      type: table
      columns:
        - { label: クラスター, atom: ec2-cluster-placement-group }
        - { label: パーティション, atom: ec2-partition-placement-group }
        - { label: スプレッド, atom: ec2-spread-placement-group }
      rows:
        - label: 配置
          cells: [1 つの AZ の中で近くにまとめる, パーティションごとに別のラック, 1 台ずつ別のラック]
        - label: 目的
          cells:
            - { text: 低レイテンシ・高スループット, tone: good }
            - ラックの障害の影響をパーティション内に閉じ込める
            - { text: 1 台の障害が他に及ばない, tone: good }
        - label: 規模
          cells: [多数, AZ あたり 7 パーティション（各パーティションに多数）, AZ あたり 7 台まで]
        - label: 複数の AZ
          cells:
            - { text: 使えない, tone: bad }
            - 使える
            - 使える
        - label: 向いている処理
          cells: [密結合の HPC, HDFS・Cassandra・Kafka などの分散システム, 少数の重要なサーバー]
    points:
      - HPC のノード間通信をさらに速くするなら、クラスターに EFA（Elastic Fabric Adapter）を組み合わせる

  - title: ディスクの選び方
    diagram:
      type: table
      columns:
        - { label: EBS, atom: ec2-ebs-volume, icon: ebs }
        - { label: インスタンスストア, atom: ec2-instance-store, icon: g-disk }
        - { label: EFS, atom: efs-filesystem, icon: efs }
      rows:
        - label: つながり方
          cells: [ネットワーク越し（1 つの AZ）, ホストに直接, ネットワーク越し（複数の AZ）]
        - label: 停止・終了すると
          cells:
            - { text: 残る, tone: good }
            - { text: 消える, tone: bad }
            - { text: 残る, tone: good }
        - label: 同時に使えるインスタンス
          cells: [基本は 1 台（io1/io2 のマルチアタッチを除く）, そのインスタンスだけ, 多数（数千台）]
        - label: 向いている使い方
          cells: [OS・DB のディスク, キャッシュ・一時ファイル, 複数台での共有ファイル]
status: draft
sources:
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Storage.html
  - https://aws.amazon.com/ec2/instance-types/
