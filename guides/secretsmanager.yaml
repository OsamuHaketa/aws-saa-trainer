# 秘密情報と運用の図解（Secrets Manager のページが本体。Systems Manager のページにも出す）
# スキーマ: lib/schema/guide.ts / 検証: npm run validate
# status: draft は未確認。公式ドキュメントで確認したら reviewed にして lastVerified を付ける

service: secretsmanager
alsoShowOn: [ssm]
topic: 秘密情報の保管と、サーバーの運用
lead: DB のパスワードや API キーなどの秘密情報を暗号化して保管し、自動でローテーションするサービス。アプリは実行時に API で取り出すので、コードに秘密情報を書かずに済む
decisions:
  - Secrets Manager と Parameter Store のどちらに保管するか
  - SSH を開けずにサーバーを操作・パッチ適用する方法
sections:
  - title: Secrets Manager と Parameter Store
    diagram:
      type: table
      columns:
        - { label: Secrets Manager, atom: secretsmanager-secret, icon: secretsmanager }
        - { label: Parameter Store, atom: ssm-parameter-store, icon: ssm }
      rows:
        - label: 自動ローテーション
          cells:
            - { text: できる（RDS などと連携）, tone: good }
            - { text: 組み込みではない, tone: bad }
        - label: 料金
          cells:
            - { text: 秘密情報の数と API の呼び出しに応じて, tone: warn }
            - { text: 標準のパラメータは無料, tone: good }
        - label: 向いているもの
          cells: [定期的に変える DB のパスワード・API キー, 設定値・変えることの少ない秘密情報]
    points:
      - どちらも KMS で暗号化して保存でき、IAM で読める人を絞れる

  - title: SSH を開けずにサーバーを運用する
    diagram:
      type: decision
      tree:
        question: 何をしたい？
        branches:
          - when: インスタンスにシェルで接続したい（踏み台もポートの開放もなし）
            atom: ssm-session-manager
          - when: 多数のインスタンスに OS のパッチを決まった時間に当てたい
            atom: ssm-patch-manager
          - when: 多数のインスタンスで同じコマンドを一斉に実行したい
            atom: ssm-run-command
          - when: 設定値を階層的に保管したい
            atom: ssm-parameter-store
    points:
      - Systems Manager で管理するには、インスタンスに SSM エージェントと、SSM を使う権限の IAM ロールが必要
status: draft
sources:
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  - https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html
  - https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
