# S3 の図解
# スキーマ: lib/schema/guide.ts / 検証: npm run validate
# status: draft は未確認。公式ドキュメントで確認したら reviewed にして lastVerified を付ける

service: s3
lead: 容量無制限のオブジェクトストレージ。バケットにファイル（オブジェクト）を置き、HTTPS の API で読み書きする。耐久性は 99.999999999%（イレブンナイン）
decisions:
  - アクセス頻度と取り出し時間から、ストレージクラスを選ぶ
  - 誰にアクセスさせるかで、IAM ポリシー・バケットポリシー・署名付き URL・CloudFront を使い分ける
  - 鍵の管理と監査の要件で、暗号化の方式を選ぶ
  - 誤削除・改ざん・災害への備えとして、バージョニング・Object Lock・レプリケーションを組み合わせる
  - 大きなファイルや遠隔地からの転送を、どの機能で速くするか
sections:
  - title: 全体像
    body: S3 はリージョンのサービスで、VPC の中には置かない。VPC からはエンドポイント経由、インターネットからは CloudFront 経由で使うのが定番の形。
    diagram:
      type: architecture
      cols: 6
      rows: 4
      groups:
        - label: リージョン A
          kind: region
          at: [2, 0, 3, 4]
        - label: VPC
          kind: vpc
          at: [2, 2, 1.5, 2]
        - label: リージョン B
          kind: region
          at: [5, 0, 1, 4]
      nodes:
        - id: users
          label: ユーザー
          icon: g-users
          at: [0, 1.3]
        - id: cf
          label: CloudFront
          icon: cloudfront
          atom: s3-origin-access-control
          at: [1, 1.3]
        - id: bucket
          label: S3 バケット
          icon: bucket-objects
          at: [3.3, 1.3]
        - id: lambda
          label: Lambda
          icon: lambda
          atom: s3-event-notifications
          at: [4.1, 0.3]
        - id: glacier
          label: Glacier
          icon: s3-glacier-fr
          atom: s3-lifecycle
          at: [4.1, 2.6]
        - id: replica
          label: レプリカ
          icon: bucket
          atom: s3-cross-region-replication
          at: [5, 1.3]
        - id: ec2
          label: EC2
          icon: instance
          at: [2, 3]
        - id: gwe
          label: "ゲートウェイ\nエンドポイント"
          icon: vpc-endpoint
          atom: s3-gateway-endpoint
          at: [3, 3]
      edges:
        - { from: users, to: cf }
        - { from: cf, to: bucket, label: OAC }
        - { from: ec2, to: gwe }
        - { from: gwe, to: bucket }
        - { from: bucket, to: glacier, label: ライフサイクル }
        - { from: bucket, to: replica, label: CRR }
        - { from: bucket, to: lambda, label: イベント通知, dashed: true }
      caption: 図のアイコンをタップすると、その用語のカードに移動する

  - title: ストレージクラスの選び方
    body: 左ほど頻繁にアクセスするデータ向けで、右ほど保存料金が安い代わりに、取り出しの料金や時間がかかる。
    diagram:
      type: table
      axis: { left: 頻繁にアクセス, right: ほとんど取り出さない }
      columns:
        - { label: Standard, atom: s3-standard, icon: s3 }
        - { label: Intelligent-Tiering, atom: s3-intelligent-tiering, icon: s3 }
        - { label: Standard-IA, atom: s3-standard-ia, icon: s3 }
        - { label: One Zone-IA, atom: s3-one-zone-ia, icon: s3 }
        - { label: Glacier Instant Retrieval, atom: s3-glacier-instant-retrieval, icon: s3-glacier-ir }
        - { label: Glacier Flexible Retrieval, atom: s3-glacier-flexible-retrieval, icon: s3-glacier-fr }
        - { label: Glacier Deep Archive, atom: s3-glacier-deep-archive, icon: s3-glacier-da }
      rows:
        - label: 想定するアクセス
          cells: [頻繁, 予測できない・変わる, 月 1 回程度, 月 1 回程度（再作成できる）, 四半期に 1 回程度, 年に 1〜2 回, 年に 1 回未満]
        - label: 保存する AZ
          cells:
            - 3 つ以上
            - 3 つ以上
            - 3 つ以上
            - { text: 1 つだけ, tone: bad }
            - 3 つ以上
            - 3 つ以上
            - 3 つ以上
        - label: 取り出し時間
          cells:
            - ミリ秒
            - ミリ秒 ※
            - ミリ秒
            - ミリ秒
            - ミリ秒
            - { text: 数分〜12 時間（復元が必要）, tone: warn }
            - { text: 12〜48 時間（復元が必要）, tone: bad }
        - label: 取り出し料金
          cells:
            - { text: なし, tone: good }
            - { text: なし（監視料金はかかる）, tone: good }
            - あり
            - あり
            - あり（高め）
            - あり（大容量は無料）
            - あり
        - label: 最低保存期間
          cells:
            - { text: なし, tone: good }
            - { text: なし, tone: good }
            - 30 日
            - 30 日
            - 90 日
            - 90 日
            - 180 日
    points:
      - ※ Intelligent-Tiering で任意のアーカイブ階層を有効にした場合、そこへ移ったオブジェクトは復元が必要
      - 1 桁ミリ秒の低レイテンシが必要なら S3 Express One Zone（単一 AZ・ディレクトリバケット）
      - 最低保存期間より前に削除・移動しても、最低保存期間の分の料金がかかる
      - IA 系と Glacier Instant Retrieval は、128 KB 未満のオブジェクトも 128 KB として課金される

  - title: ストレージクラスの判断フロー
    diagram:
      type: decision
      tree:
        question: アクセスのパターンは分かっている？
        branches:
          - when: 予測できない・時期によって変わる
            atom: s3-intelligent-tiering
          - when: 分かっている
            next:
              question: 取り出しにどれだけ待てる？
              branches:
                - when: すぐに（ミリ秒で）必要
                  next:
                    question: どのくらいの頻度で読む？
                    branches:
                      - when: 頻繁
                        atom: s3-standard
                      - when: 月 1 回程度で、AZ 障害で失っても再作成できる
                        atom: s3-one-zone-ia
                      - when: 月 1 回程度
                        atom: s3-standard-ia
                      - when: 四半期に 1 回程度
                        atom: s3-glacier-instant-retrieval
                - when: 数分〜数時間なら待てる
                  atom: s3-glacier-flexible-retrieval
                - when: 12 時間以上待てて、とにかく安く（規制対応の長期保管）
                  atom: s3-glacier-deep-archive

  - title: ライフサイクルで自動的に移す
    body: 作成からの経過日数でクラスを移し、最後は削除する。アクセス状況を見て自動で移したいなら、ライフサイクルではなく Intelligent-Tiering。
    diagram:
      type: flow
      steps:
        - { label: Standard, icon: s3, atom: s3-standard, note: 作成直後はよく読む }
        - { label: Standard-IA, icon: s3, atom: s3-standard-ia, via: 30 日後 }
        - { label: Glacier Flexible Retrieval, icon: s3-glacier-fr, atom: s3-glacier-flexible-retrieval, via: 90 日後 }
        - { label: Deep Archive, icon: s3-glacier-da, atom: s3-glacier-deep-archive, via: 1 年後 }
        - { label: 削除, icon: g-recover, atom: s3-lifecycle, note: 有効期限アクション, via: 7 年後 }
      caption: 日数は一例。Standard-IA / One Zone-IA へは、作成から 30 日以上経ってからでないと移せない
    points:
      - 古いバージョンの削除や、未完了のマルチパートアップロードの中止もライフサイクルで設定できる

  - title: アクセスを許可する方法
    diagram:
      type: decision
      tree:
        question: 誰にアクセスさせる？
        branches:
          - when: 同じアカウントの IAM ユーザー・ロール（EC2・Lambda を含む）
            atom: s3-iam-policy
          - when: 別の AWS アカウント（相手側の IAM ポリシーでも許可が必要）
            atom: s3-bucket-policy
          - when: AWS の認証情報を持たない人に、期限付きで特定のオブジェクトだけ
            atom: s3-presigned-url
          - when: 多くのアプリ・チームが共有するバケットを、用途ごとのポリシーで
            atom: s3-access-points
          - when: 世界中のユーザーに配信するが、バケットは非公開のまま
            atom: s3-origin-access-control
    points:
      - Block Public Access は、パブリックアクセスを許可するバケットポリシーや ACL より優先してブロックする
      - IAM ポリシーでもバケットポリシーでも、明示的な Deny は Allow より常に優先される
      - ACL は無効（オブジェクト所有権を「バケット所有者の強制」）にして、ポリシーで制御するのが推奨

  - title: 暗号化の方式
    body: 保存時の暗号化は、鍵を誰が持つかと、鍵の使用を監査する必要があるかで選ぶ。通信の暗号化（HTTPS の強制）は別に、バケットポリシーの aws:SecureTransport で行う。
    diagram:
      type: table
      columns:
        - { label: SSE-S3, atom: s3-sse-s3 }
        - { label: SSE-KMS, atom: s3-sse-kms, icon: kms }
        - { label: SSE-C, atom: s3-sse-c }
        - { label: クライアント側暗号化, atom: s3-client-side-encryption }
      rows:
        - label: 鍵を管理するのは
          cells: [S3, KMS（AWS マネージド or カスタマーマネージド）, 利用者（リクエストのたびに渡す）, 利用者]
        - label: 暗号化する場所
          cells: [S3, S3, S3, 利用者の環境（送る前）]
        - label: 鍵の使用の監査
          cells:
            - { text: できない, tone: bad }
            - { text: CloudTrail に記録, tone: good }
            - { text: できない, tone: bad }
            - 利用者次第
        - label: 追加料金
          cells:
            - { text: なし, tone: good }
            - { text: KMS のリクエスト料金, tone: warn }
            - { text: なし, tone: good }
            - 利用者側の処理
        - label: 選ぶ場面
          cells: [特に要件がない（デフォルト）, 鍵のアクセス制御と監査が必要, 鍵を AWS に保存したくない, AWS に平文を渡したくない]
    points:
      - SSE-KMS で KMS のリクエスト料金やスロットリングが問題になったら、S3 バケットキーを有効にする

  - title: データを守る
    diagram:
      type: decision
      tree:
        question: 何から守りたい？
        branches:
          - when: 誤った上書き・削除（過去の版に戻したい）
            atom: s3-versioning
          - when: バージョンの完全削除に、MFA を必須にしたい
            atom: s3-mfa-delete
          - when: 一定期間、誰も削除・上書きできないようにしたい（WORM）
            next:
              question: 保持期間中に解除できる人が必要？
              branches:
                - when: ルートユーザーも含め、誰も解除できない（厳格な規制）
                  atom: s3-object-lock-compliance
                - when: 特別な権限を持つ人だけは解除できる
                  atom: s3-object-lock-governance
                - when: 期限を決めずに、解除するまで保持する（訴訟など）
                  atom: s3-legal-hold
          - when: リージョンの障害（別リージョンにコピーを持つ）
            atom: s3-cross-region-replication
          - when: レプリケーションを 15 分以内に終える SLA が必要
            atom: s3-replication-time-control
    points:
      - レプリケーションと Object Lock は、どちらもバージョニングが前提
      - レプリケーションは、ルールを作る前からあるオブジェクトをコピーしない（S3 バッチレプリケーションを使う）

  - title: 性能を上げる
    diagram:
      type: decision
      tree:
        question: 何を速くしたい？
        branches:
          - when: 大きなファイルのアップロード（100 MB 超で推奨、5 GB 超で必須）
            atom: s3-multipart-upload
          - when: 遠く離れた場所から 1 つのバケットへのアップロード
            atom: s3-transfer-acceleration
          - when: 大きなファイルのダウンロード、一部だけの読み取り
            atom: s3-byte-range-fetch
          - when: 毎秒数千を超えるリクエスト
            atom: s3-prefix-performance
          - when: 1 桁ミリ秒のレイテンシ（機械学習・分析）
            atom: s3-express-one-zone
status: draft
sources:
