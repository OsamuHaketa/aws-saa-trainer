# ECS / Fargate Knowledge Atoms
service: ecs

atoms:
  - id: ecs-fargate
    category: containers
    concept: AWS Fargate
    summary: サーバー（EC2）を管理せずにコンテナを実行するサーバーレスのコンピューティング
    facts:
      - コンテナを動かす EC2 の管理（パッチ、スケーリング、台数の管理）が不要
      - タスクに割り当てた vCPU とメモリの量と時間で課金される
      - ECS と EKS のどちらでも使える
      - Lambda の 15 分の制限を超える長時間の処理もコンテナで実行できる
    triggers:
      - サーバーを管理せずにコンテナを動かしたい
      - サーバーレスのコンテナ
    pitfalls:
      - GPU や特定のインスタンスタイプが必要な場合は、EC2 起動タイプを使う
    relations:
      - type: confused_with
        target: ecs-ec2-launch-type
        distinction: Fargate はコンテナを動かすサーバーの管理が不要。EC2 起動タイプは自分で EC2 のクラスターを管理する代わりに、インスタンスタイプの選択や GPU、RI・スポットの活用などの自由度がある
    examDomains: [performance, cost]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html

  - id: ecs-ec2-launch-type
    category: containers
    concept: ECS の EC2 起動タイプ
    summary: 自分で管理する EC2 のクラスターの上でコンテナを実行する
    facts:
      - コンテナを動かす EC2 インスタンスを自分で用意・管理する
      - GPU や特定のインスタンスタイプを選べる
      - リザーブドインスタンスやスポットを使ってコストを最適化できる
    triggers:
      - GPU が必要なコンテナ
      - インスタンスのレベルで細かく制御したい
    pitfalls:
      - インスタンスのパッチやスケーリングの運用が必要になる
    relations: []
    examDomains: [cost]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/launch_types.html

  - id: ecs-task-role
    category: containers
    concept: タスクロールとタスク実行ロール
    summary: コンテナのアプリが AWS を使う権限はタスクロール、イメージの取得やログの送信はタスク実行ロール
    facts:
      - タスクロールは、コンテナ内のアプリが S3 や DynamoDB などを呼ぶための権限
      - タスク実行ロールは、ECS エージェントが ECR からイメージを取得したり、CloudWatch Logs にログを送ったりする権限
      - タスクごとにロールを分けて、最小権限にできる
    triggers:
      - コンテナのアプリから S3 にアクセスしたい
      - ECR からイメージを取得できない
    pitfalls:
      - アプリ用の権限を EC2 のインスタンスロールに付けると、同じホストの全タスクがその権限を持つ
    relations:
      - type: used_with
        target: iam-role
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html

  - id: ecs-ecr
    category: containers
    concept: Amazon ECR
    summary: コンテナイメージを保存・管理するマネージドなレジストリ。脆弱性のスキャンやリージョン間の複製もできる
    facts:
      - ECS、EKS、Lambda などが使うコンテナイメージを保存する
      - IAM でイメージのプッシュ・プルの権限を制御する
      - イメージのスキャン（Inspector と連携）や、リージョン・アカウント間のレプリケーションができる
      - ライフサイクルポリシーで古いイメージを自動で削除できる
    triggers:
      - コンテナイメージをプライベートに保存したい
      - イメージの脆弱性をスキャンしたい
    pitfalls:
      - 古いイメージを削除しないと、保存の料金が増え続ける
    relations:
      - type: used_with
        target: ecs-fargate
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html
