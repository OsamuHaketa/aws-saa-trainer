# Glue Knowledge Atoms
service: glue

atoms:
  - id: glue-etl
    category: analytics
    concept: AWS Glue
    summary: サーバーレスの ETL と、データのスキーマを管理する Data Catalog
    facts:
      - サーバーレスで、データの抽出・変換・ロード（ETL）を行う
      - クローラーが S3 などのデータを調べ、スキーマを Data Catalog に登録する
      - Data Catalog は Athena、Redshift Spectrum、EMR から使える
      - CSV を Parquet に変換するなどの処理に使う
    triggers:
      - サーバーレスの ETL
      - S3 のデータのスキーマを自動で見つけたい
      - データカタログ
    pitfalls:
      - Spark や Hadoop のクラスターを細かく制御して動かしたいなら EMR を使う
    relations:
      - type: confused_with
        target: emr-cluster
        distinction: Glue はサーバーレスの ETL とデータカタログで、クラスターの管理が不要。EMR は Hadoop や Spark のクラスターを使い、大規模なビッグデータ処理を細かく制御できる
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html

  - id: glue-crawler
    category: analytics
    concept: Glue クローラーと Data Catalog
    summary: S3 などのデータを調べてスキーマを推定し、Data Catalog にテーブルとして登録する
    facts:
      - クローラーが S3 のファイルを読み、列やパーティションを推定してテーブル定義を作る
      - Data Catalog のテーブルは、Athena、Redshift Spectrum、EMR などから共通で使える
      - スケジュールで定期的に実行し、新しいパーティションを自動で追加できる
    triggers:
      - S3 のデータのテーブル定義を自動で作りたい
      - Athena から新しいパーティションが見えない
    pitfalls:
      - パーティションを追加しても Data Catalog に登録されないと、Athena のクエリの対象にならない
    relations:
      - type: part_of
        target: glue-etl
      - type: used_with
        target: athena-query
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/glue/latest/dg/add-crawler.html
