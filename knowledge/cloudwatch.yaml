# CloudWatch Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: cloudwatch

atoms:
  - id: cloudwatch-metrics
    category: monitoring
    concept: CloudWatch メトリクス
    summary: AWS リソースの性能の数値を集めて監視する。EC2 のメモリやディスクの使用率は標準では集めない
    facts:
      - EC2 の CPU 使用率やネットワークなどは、標準で集められる
      - EC2 のメモリ使用率やディスクの空き容量は、標準では集められない（CloudWatch エージェントが必要）
      - 独自のメトリクス（カスタムメトリクス）を送れる
    triggers:
      - AWS リソースの性能を監視したい
      - EC2 のメモリ使用率を監視したい
    pitfalls:
      - エージェントを入れないと、メモリ使用率のメトリクスは存在しない
    relations:
      - type: used_with
        target: cloudwatch-agent
    examDomains: [performance, resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/working_with_metrics.html

  - id: cloudwatch-agent
    category: monitoring
    concept: CloudWatch エージェント
    summary: EC2 やオンプレミスのサーバーから、メモリやディスクのメトリクスとログを集める
    facts:
      - サーバーに入れて、メモリ使用率やディスクの使用率などの OS 内部のメトリクスを送る
      - アプリのログファイルを CloudWatch Logs に送れる
      - オンプレミスのサーバーにも入れられる
    triggers:
      - メモリ使用率を監視したい
      - サーバーのログを CloudWatch に集めたい
    pitfalls:
      - エージェントなしでは、OS の中の情報は CloudWatch から見えない
    relations: []
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Install-CloudWatch-Agent.html

  - id: cloudwatch-alarms
    category: monitoring
    concept: CloudWatch アラーム
    summary: メトリクスがしきい値を超えたら、通知や Auto Scaling、EC2 の復旧などを実行する
    facts:
      - メトリクスがしきい値を一定期間超えると、アラームの状態になる
      - SNS での通知、Auto Scaling のスケーリング、EC2 の停止・再起動・復旧を実行できる
      - 複数のアラームを組み合わせた複合アラームで、誤報を減らせる
    triggers:
      - CPU が高くなったら通知したい
      - EC2 のハードウェア障害時に自動で復旧させたい
    pitfalls:
      - しきい値を超えた瞬間ごとに通知すると誤報が多くなる。評価期間や複合アラームで調整する
    relations: []
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html

  - id: cloudwatch-logs
    category: monitoring
    concept: CloudWatch Logs
    summary: アプリや AWS サービスのログを集めて保管・検索し、メトリクスフィルターで監視する
    facts:
      - アプリ、Lambda、VPC フローログなどのログを集めて保管する
      - 保持期間を設定できる
      - メトリクスフィルターで、ログの中の特定の文字列（ERROR など）の数をメトリクスにし、アラームを設定できる
      - Logs Insights でログを検索・分析できる
    triggers:
      - ログに ERROR が出たら通知したい
      - ログを集めて検索したい
    pitfalls:
      - 保持期間を「無期限」のままにすると、保管料金が増え続ける
    relations: []
    examDomains: [resilient]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html

  - id: cloudwatch-logs-insights
    category: monitoring
    concept: CloudWatch Logs Insights
    summary: CloudWatch Logs のログを、専用のクエリ言語で対話的に検索・集計する
    facts:
      - ロググループに対して、フィルタ、集計、並べ替えのクエリを実行する
      - 追加のサーバーやデータの移動なしに、すぐにログを分析できる
      - スキャンしたデータ量に応じて料金がかかる
    triggers:
      - ログからエラーの件数を時間ごとに集計したい
      - CloudWatch Logs のログをその場で分析したい
    pitfalls:
      - 継続的な監視と通知には、メトリクスフィルターとアラームを使う
    relations:
      - type: part_of
        target: cloudwatch-logs
    examDomains: [performance]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AnalyzingLogData.html

  - id: cloudwatch-composite-alarms
    category: monitoring
    concept: 複合アラーム
    summary: 複数のアラームの状態を AND / OR で組み合わせ、本当に対応が必要なときだけ通知する
    facts:
      - 複数のアラームの状態を、AND、OR、NOT のルールで組み合わせる
      - 同じ障害で大量の通知が来る（アラームの嵐）のを減らせる
    triggers:
      - CPU が高く、かつエラー率も高いときだけ通知したい
      - 通知が多すぎて重要なものを見逃す
    pitfalls:
      - 個々のアラームすべてに通知を付けると、1 つの障害で大量の通知が届く
    relations:
      - type: part_of
        target: cloudwatch-alarms
    examDomains: [resilient]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Composite_Alarm.html

  - id: cloudwatch-logs-subscription
    category: monitoring
    concept: CloudWatch Logs のサブスクリプションフィルター
    summary: ログをリアルタイムに Lambda、Kinesis、Data Firehose、OpenSearch などへ送る
    facts:
      - ロググループに届いたログを、条件に合うものだけリアルタイムに転送する
      - 送り先は Lambda、Kinesis Data Streams、Data Firehose、OpenSearch Service など
      - 別のアカウントに送り、ログを 1 か所に集約することもできる
    triggers:
      - ログをリアルタイムに別のシステムへ流したい
      - 複数のアカウントのログを 1 か所に集めたい
    pitfalls:
      - 定期的に S3 へエクスポートするだけでは、リアルタイムの処理にならない
    relations:
      - type: part_of
        target: cloudwatch-logs
      - type: used_with
        target: kinesis-firehose
    examDomains: [performance]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Subscriptions.html
