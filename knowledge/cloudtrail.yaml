# CloudTrail Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: cloudtrail

atoms:
  - id: cloudtrail-trail
    category: audit
    concept: AWS CloudTrail
    summary: 誰が、いつ、どの API を呼んだかという操作の履歴を記録する
    facts:
      - AWS アカウントでの API の呼び出し（コンソールの操作も含む）を記録する
      - 誰が、いつ、どこから、何をしたかを調べられる
      - 証跡を作ると、ログを S3 に長期保存できる。Organizations の全アカウント分をまとめることもできる
      - ログファイルの整合性の検証で、改ざんを検知できる
    triggers:
      - 誰がリソースを削除したか調べたい
      - API の操作履歴の監査
    pitfalls:
      - 性能のメトリクスの監視には CloudWatch を使う
    relations:
      - type: confused_with
        target: cloudwatch-metrics
        distinction: CloudTrail は「誰が何の操作をしたか」の履歴。CloudWatch は「リソースの状態や性能」の数値とログの監視
      - type: confused_with
        target: config-rules
        distinction: CloudTrail は API の操作の履歴。AWS Config はリソースの設定の変更履歴を記録し、ルールに違反していないかを評価する
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html

  - id: cloudtrail-data-events
    category: audit
    concept: 管理イベントとデータイベント
    summary: リソースの作成・変更などの管理イベントはデフォルトで記録され、S3 のオブジェクト操作などのデータイベントは別途有効にする
    facts:
      - 管理イベント（バケットやインスタンスの作成・削除など）はデフォルトで記録される
      - データイベント（S3 の GetObject / PutObject、Lambda の Invoke など）は、証跡で有効にしないと記録されない
      - データイベントは量が多く、追加の料金がかかる
      - イベント履歴は直近 90 日の管理イベントを見られるが、長期保管には証跡で S3 に保存する
    triggers:
      - 誰が S3 のオブジェクトを読んだかを記録したい
      - オブジェクト単位の操作の監査
    pitfalls:
      - デフォルトの設定のままでは、S3 のオブジェクトの読み取りは記録されていない
    relations:
      - type: part_of
        target: cloudtrail-trail
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
