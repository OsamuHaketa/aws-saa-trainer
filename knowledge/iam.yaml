# IAM Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: iam

atoms:
  - id: iam-root-user
    category: identity
    concept: ルートユーザー
    summary: アカウント作成時のメールアドレスでログインする、すべての権限を持つユーザー
    facts:
      - アカウントのすべてのリソースと請求情報に対する完全な権限を持つ
      - IAM ポリシーでは権限を制限できない
      - MFA を有効にし、日常の作業には使わない
      - ルートユーザーのアクセスキーは作らない
      - Organizations のメンバーアカウントでは、ルートアクセスの一元管理でルートユーザーの認証情報（パスワード・アクセスキー・MFA）を削除できる
    triggers:
      - アカウントの最上位の権限
      - ルートユーザーの保護
    pitfalls:
      - 日常の管理作業をルートユーザーで行うのは不適切。管理者権限を持つ IAM ユーザーや Identity Center のユーザーを使う
    relations: []
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html

  - id: iam-user
    category: identity
    concept: IAM ユーザー
    summary: パスワードやアクセスキーなどの長期の認証情報を持つ、人やアプリの ID
    facts:
      - パスワード（コンソール用）とアクセスキー（API 用）という長期の認証情報を持てる
      - 人がアクセスする場合は、IAM Identity Center やフェデレーションで一時的な認証情報を使うのが推奨
      - アクセスキーは定期的にローテーションする
    triggers:
      - 個人ごとの ID を作る
      - アクセスキーを発行する
    pitfalls:
      - 複数人で 1 つの IAM ユーザーを共有すると、誰が操作したかわからなくなる
    relations:
      - type: confused_with
        target: iam-role
        distinction: IAM ユーザーは長期の認証情報を持つ固定の ID。IAM ロールは長期の認証情報を持たず、引き受けた人やサービスに一時的な認証情報を渡す
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_users.html

  - id: iam-group
    category: identity
    concept: IAM グループ
    summary: IAM ユーザーをまとめ、グループに付けたポリシーを全員に適用する
    facts:
      - 複数の IAM ユーザーに、同じ権限をまとめて付けられる
      - グループの中にグループを入れる（入れ子にする）ことはできない
      - グループはポリシーの Principal として指定できない
    triggers:
      - 部署ごとに同じ権限をまとめて付けたい
      - 人の異動に合わせて権限を付け替えたい
    pitfalls:
      - ユーザーごとに個別にポリシーを付けると、管理が煩雑になる
    relations: []
    examDomains: [secure]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html

  - id: iam-role
    category: identity
    concept: IAM ロール
    summary: 長期の認証情報を持たず、引き受けた人や AWS サービスに一時的な認証情報を渡す ID
    facts:
      - 引き受ける（AssumeRole）と、STS から一時的な認証情報が発行される
      - EC2（インスタンスプロファイル）や Lambda などの AWS サービスに権限を与えるのに使う
      - 別アカウントのユーザーや、外部の ID プロバイダーのユーザーにも使わせられる
      - 信頼ポリシーで「誰が引き受けられるか」を、権限ポリシーで「何ができるか」を決める
    triggers:
      - AWS のサービスに権限を与える
      - 一時的な認証情報
      - アクセスキーを使いたくない
    pitfalls:
      - アプリにアクセスキーを埋め込むのではなく、ロールを使う
    relations:
      - type: used_with
        target: iam-sts
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html

  - id: iam-sts
    category: identity
    concept: AWS STS（Security Token Service）
    summary: ロールの引き受けやフェデレーションのために、一時的な認証情報を発行する
    facts:
      - 有効期限付きの一時的な認証情報（アクセスキー、シークレット、セッショントークン）を発行する
      - AssumeRole（ロールの引き受け）、AssumeRoleWithSAML（SAML フェデレーション）、AssumeRoleWithWebIdentity（Web ID フェデレーション）などがある
      - 期限が切れると自動で使えなくなるので、長期の認証情報より安全
    triggers:
      - 一時的な認証情報を発行する
      - 有効期限付きの認証情報
    pitfalls:
      - 長期のアクセスキーを配るより、一時的な認証情報を使う方が漏えい時の影響が小さい
    relations: []
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html

  - id: iam-cross-account-role
    category: access-control
    concept: クロスアカウントロール
    summary: 別アカウントのユーザーに、自分のアカウントのロールを引き受けさせてアクセスさせる
    facts:
      - アクセスされる側のアカウントでロールを作り、信頼ポリシーで相手のアカウントを許可する
      - 相手のアカウントのユーザーは AssumeRole で一時的な認証情報を得てアクセスする
      - アカウントごとに IAM ユーザーを作る必要がない
      - サードパーティにアクセスさせるときは、外部 ID を条件にして「混乱した代理」の問題を防ぐ
    triggers:
      - 別のアカウントのリソースを操作させたい
      - 複数アカウントを 1 つのユーザーで行き来したい
      - 外部の業者にアカウントへのアクセスを許可する
    pitfalls:
      - 相手のアカウントごとに IAM ユーザーとアクセスキーを作って渡すのは不適切
    relations:
      - type: used_with
        target: iam-role
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html

  - id: iam-policy-evaluation
    category: access-control
    concept: ポリシーの評価ロジック
    summary: 明示的な拒否 > 明示的な許可 > 暗黙的な拒否 の順で、アクセスの可否が決まる
    facts:
      - 何も許可されていなければ、デフォルトで拒否される（暗黙的な拒否）
      - どこかで明示的に許可されていれば許可される
      - どこかに明示的な拒否（Deny）があれば、許可があっても必ず拒否される
    triggers:
      - Allow と Deny の両方がある場合
      - 権限があるはずなのに拒否される
    pitfalls:
      - 許可のポリシーを追加しても、別のポリシー（SCP やバケットポリシーなど）の明示的な Deny は上書きできない
    relations: []
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html

  - id: iam-permissions-boundary
    category: access-control
    concept: アクセス許可の境界（Permissions Boundary）
    summary: IAM ユーザーやロールが持てる権限の上限を設定する
    facts:
      - ユーザーやロールに付けられる権限の最大値を決める
      - 実際の権限は、アイデンティティベースのポリシーと境界の両方で許可されたものだけ（重なった部分）
      - 開発者にロールの作成を任せつつ、権限の昇格を防ぐのに使う
    triggers:
      - 開発者に IAM ロールを作らせたいが、管理者権限は付けさせたくない
      - 権限の上限を決めたい
    pitfalls:
      - 境界だけでは権限は与えられない。アイデンティティベースのポリシーでの許可も必要
    relations:
      - type: confused_with
        target: organizations-scp
        distinction: アクセス許可の境界は個々の IAM ユーザーやロールの権限の上限。SCP は Organizations のアカウント（OU）全体の権限の上限
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html

  - id: iam-least-privilege
    category: access-control
    concept: 最小権限の原則
    summary: 作業に必要な最小限の権限だけを与える
    facts:
      - ユーザーやロールには、必要な操作とリソースだけを許可する
      - AdministratorAccess などの広い権限を日常的に使わない
      - IAM Access Analyzer で、実際の利用履歴から最小権限のポリシーを作れる
    triggers:
      - 必要最小限の権限
      - 権限を絞りたい
    pitfalls:
      - 「とりあえず」で管理者権限や "*" を付けると、誤操作や漏えいの影響が大きくなる
    relations:
      - type: used_with
        target: iam-access-analyzer
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html

  - id: iam-mfa
    category: identity
    concept: 多要素認証（MFA）
    summary: パスワードに加えて、デバイスなどによる 2 つ目の要素で認証する
    facts:
      - ルートユーザーと、権限の強いユーザーには MFA を必ず設定する
      - ポリシーの条件 aws:MultiFactorAuthPresent で、MFA を使った場合だけ操作を許可できる
    triggers:
      - パスワードが漏れても不正ログインされないようにしたい
      - 重要な操作に MFA を必須にしたい
    pitfalls:
      - パスワードの複雑さだけに頼ると、漏えいしたときに防げない
    relations: []
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html

  - id: iam-identity-center
    category: identity
    concept: IAM Identity Center
    summary: 複数の AWS アカウントやアプリへの従業員のアクセスを、1 か所でシングルサインオン管理する
    facts:
      - Organizations の複数アカウントへのアクセスを一元管理し、シングルサインオンを提供する
      - Active Directory や Okta などの外部の ID プロバイダーと連携できる
      - アクセス許可セットで、アカウントごとに付ける権限を定義する
      - 利用者は一時的な認証情報でアクセスするので、IAM ユーザーを作らなくてよい
    triggers:
      - 複数アカウントへのシングルサインオン
      - 社内の Active Directory のユーザーで AWS にログインしたい
      - 従業員のアクセスを一元管理したい
    pitfalls:
      - アカウントごとに IAM ユーザーを作ると、アカウントと人の数だけ管理が増える
    relations: []
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html

  - id: iam-access-analyzer
    category: access-control
    concept: IAM Access Analyzer
    summary: 外部と共有されているリソースや、使われていない権限を見つけ、最小権限のポリシー作成を助ける
    facts:
      - S3 バケット、KMS キー、IAM ロールなどが、アカウントや組織の外と共有されていないかを検出する
      - 使われていないアクセス権限を見つけられる
      - CloudTrail の履歴から、実際に使った操作だけを許可するポリシーを生成できる
      - ポリシーの文法やベストプラクティスを検証できる
    triggers:
      - 外部に公開されているリソースを見つけたい
      - 使っていない権限を洗い出したい
      - 最小権限のポリシーを作りたい
    pitfalls:
      - 手作業でポリシーを見直すだけでは、外部との共有を見落としやすい
    relations: []
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html

  # --- 追加 ------------------------------------------------------------------

  - id: iam-instance-profile
    category: identity
    concept: インスタンスプロファイル（EC2 の IAM ロール）
    summary: EC2 に IAM ロールを渡す入れ物。インスタンス上のアプリが一時的な認証情報を自動で使える
    facts:
      - EC2 にロールを付けると、インスタンスプロファイルを通じてロールが渡される
      - アプリはインスタンスメタデータから一時的な認証情報を取得し、SDK が自動で更新する
      - 稼働中のインスタンスにも、ロールを付けたり差し替えたりできる
    triggers:
      - EC2 上のアプリから S3 や DynamoDB を使いたい
      - サーバーにアクセスキーを置きたくない
    pitfalls:
      - アクセスキーを EC2 の設定ファイルやコードに保存すると、漏えいや更新の手間の原因になる
    relations:
      - type: part_of
        target: iam-role
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html

  - id: iam-resource-based-policy
    category: access-control
    concept: リソースベースのポリシー
    summary: S3 バケットや SQS キュー、KMS キーなどのリソース側に付け、誰がアクセスできるかを決める
    facts:
      - S3 バケットポリシー、SQS のアクセスポリシー、KMS のキーポリシー、Lambda のリソースポリシーなどがある
      - Principal（誰に許可するか）を指定し、別のアカウントのユーザーやロールも指定できる
      - クロスアカウントで使うと、相手はロールを引き受けずに、自分の権限のままアクセスできる
    triggers:
      - 別のアカウントからこのバケット（キュー）にアクセスさせたい
      - ロールを切り替えずにクロスアカウントでアクセスしたい
    pitfalls:
      - すべてのサービスがリソースベースのポリシーに対応しているわけではない。対応していなければクロスアカウントロールを使う
    relations:
      - type: confused_with
        target: iam-cross-account-role
        distinction: クロスアカウントロールは相手がロールを引き受け、その間は元の権限を使えない。リソースベースのポリシーは、相手が自分の権限のままリソースにアクセスできる（両方のアカウントのリソースを同時に扱える）
      - type: used_with
        target: s3-bucket-policy
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html

  - id: iam-policy-conditions
    category: access-control
    concept: ポリシーの条件キー（Condition）
    summary: 送信元 IP、リージョン、組織、MFA、HTTPS などの条件を満たすときだけ許可・拒否する
    facts:
      - aws:SourceIp で接続元の IP アドレスを制限できる
      - aws:RequestedRegion で使えるリージョンを制限できる
      - aws:PrincipalOrgID で、自分の組織（Organizations）のアカウントからのアクセスだけに絞れる
      - aws:MultiFactorAuthPresent で MFA を、aws:SecureTransport で HTTPS を条件にできる
    triggers:
      - 特定の IP アドレスからだけ許可したい
      - 自社の組織のアカウントからだけアクセスさせたい
      - 特定のリージョンだけ使わせたい
    pitfalls:
      - 組織内のアカウントを 1 つずつ Principal に列挙すると、アカウントが増えるたびに更新が必要になる。aws:PrincipalOrgID を使う
    relations:
      - type: used_with
        target: iam-policy-evaluation
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html

  - id: iam-abac
    category: access-control
    concept: 属性ベースのアクセス制御（ABAC）
    summary: ユーザーやリソースのタグを条件にして、タグが一致するときだけアクセスを許可する
    facts:
      - プリンシパルのタグ（aws:PrincipalTag）とリソースのタグ（aws:ResourceTag）を比べて許可する
      - プロジェクトやチームが増えても、タグを付けるだけでポリシーを変えずに済む
      - ロールごとにリソースを列挙する RBAC（ロールベース）より、変化に強い
    triggers:
      - プロジェクトごとにアクセスを分けたいが、プロジェクトが頻繁に増える
      - タグでアクセスを制御したい
    pitfalls:
      - タグを誰でも変更できると、アクセス制御を回避されるおそれがある。タグの変更権限も制限する
    relations:
      - type: used_with
        target: iam-policy-conditions
    examDomains: [secure]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html

  - id: iam-federation
    category: identity
    concept: ID フェデレーション（SAML 2.0 / OIDC）
    summary: 社内の IdP や外部の ID で認証したユーザーに、IAM ユーザーを作らずに IAM ロールで AWS を使わせる
    facts:
      - SAML 2.0 に対応した社内の IdP（AD FS など）で認証し、IAM ロールを引き受けさせる
      - OIDC に対応した IdP（GitHub Actions など）のトークンで、ロールを引き受けさせることもできる
      - IAM ユーザーや長期のアクセスキーを作らずに済む
      - 複数アカウントの従業員のアクセスには、IAM Identity Center を使うのが推奨される
    triggers:
      - 社内の ID で AWS にサインインさせたい
      - CI/CD からアクセスキーなしで AWS を操作したい
    pitfalls:
      - 社員ごとに IAM ユーザーを作って社内 ID と二重管理すると、退職時の削除漏れなどが起きる
    relations:
      - type: used_with
        target: iam-sts
      - type: confused_with
        target: iam-identity-center
        distinction: IAM の SAML / OIDC フェデレーションはアカウントごとに IdP とロールを設定する。IAM Identity Center は複数のアカウントやアプリへのシングルサインオンを 1 か所で管理する
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html
