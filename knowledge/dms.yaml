# DMS Knowledge Atoms
service: dms

atoms:
  - id: dms-replication
    category: migration
    concept: AWS Database Migration Service（DMS）
    summary: 移行元の DB を動かしたまま、データベースを AWS へ移行し、変更も継続的に複製する
    facts:
      - 移行中も移行元の DB を使い続けられ、ダウンタイムを最小にできる
      - 変更データキャプチャ（CDC）で、移行後の切り替えまで変更を継続的に複製する
      - Oracle から Aurora PostgreSQL のような異なるエンジン間の移行では、スキーマ変換（DMS Schema Conversion / SCT）を使う
    triggers:
      - ダウンタイムを最小にして DB を移行したい
      - オンプレミスの Oracle を Aurora に移行したい
      - 異なる DB エンジンへの移行
    pitfalls:
      - スキーマの変換は DMS のデータ移行だけでは行われない。異なるエンジン間ではスキーマ変換のツールも使う
    relations: []
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html

  - id: dms-schema-conversion
    category: migration
    concept: スキーマ変換（DMS Schema Conversion / SCT）
    summary: 異なる種類の DB への移行で、テーブル定義やストアドプロシージャなどを移行先の形式に変換する
    facts:
      - Oracle → Aurora PostgreSQL のような異種間の移行で、スキーマやコードを変換する
      - 変換できない部分はレポートで示され、手で直す
      - データそのものの移行は DMS で行う
    triggers:
      - 異なる DB エンジンへの移行
      - ストアドプロシージャの変換
    pitfalls:
      - 同じエンジン同士（MySQL → RDS for MySQL など）の移行では、スキーマ変換は通常不要
    relations:
      - type: used_with
        target: dms-replication
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
