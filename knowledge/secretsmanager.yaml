# Secrets Manager Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: secretsmanager

atoms:
  - id: secretsmanager-secret
    category: secrets
    concept: AWS Secrets Manager
    summary: DB のパスワードなどの秘密情報を保管し、自動でローテーションする
    facts:
      - パスワード、API キーなどの秘密情報を暗号化して保管する
      - RDS、Aurora、Redshift などの認証情報を自動でローテーションできる
      - アプリは実行時に API で秘密情報を取得するので、コードや設定ファイルに書かなくてよい
    triggers:
      - DB のパスワードを自動でローテーションしたい
      - パスワードをコードに書きたくない
    pitfalls:
      - 秘密情報をソースコードや環境変数に平文で書くと、漏えいしやすい
    relations:
      - type: confused_with
        target: ssm-parameter-store
        distinction: Secrets Manager は秘密情報の保管に加え、自動ローテーションの仕組みを持つ（有料）。Parameter Store は設定値や秘密情報を安く（標準は無料）保管できるが、自動ローテーションの仕組みはない
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
