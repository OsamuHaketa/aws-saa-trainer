# 設計パターン（サービスをまたぐ考え方）の Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: patterns

atoms:
  - id: patterns-rpo-rto
    category: dr
    concept: RPO と RTO
    summary: RPO は失ってよいデータの時間、RTO は復旧までにかかってよい時間
    facts:
      - RPO（目標復旧時点）は、障害時にどこまでのデータの損失を許容できるか（例：直近 1 時間分まで）
      - RTO（目標復旧時間）は、障害からサービスを再開するまでにかけてよい時間（例：4 時間以内）
      - RPO と RTO が短いほど、DR の構成のコストは高くなる
    triggers:
      - データの損失は 15 分まで
      - 1 時間以内に復旧
    pitfalls:
      - RPO（データ）と RTO（時間）を取り違えると、要件に合わない DR 戦略を選んでしまう
    relations: []
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html

  - id: patterns-backup-restore
    category: dr
    concept: バックアップと復元（Backup & Restore）
    summary: バックアップだけを別リージョンに置き、障害時に環境ごと作り直す。最も安く、復旧に最も時間がかかる
    facts:
      - 平常時はバックアップ（スナップショット、AWS Backup など）だけを別のリージョンに置く
      - 障害時に、インフラを作り直してデータを復元する
      - 4 つの DR 戦略の中で最もコストが低く、RPO・RTO は数時間程度と最も長い
    triggers:
      - DR のコストを最小にしたい
      - 復旧に数時間〜1 日かかってもよい
    pitfalls:
      - RTO が数分〜数十分の要件には間に合わない
    relations:
      - type: confused_with
        target: patterns-pilot-light
        distinction: バックアップと復元は、DR 側にバックアップしか置かない。パイロットライトは、DB の複製などの中核の部分だけを DR 側で常に動かしておく
    examDomains: [resilient, cost]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html

  - id: patterns-pilot-light
    category: dr
    concept: パイロットライト
    summary: DB の複製などの中核だけを DR リージョンで常に動かし、障害時にほかの部分を起動する
    facts:
      - データベースの複製など、中核の部分だけを DR リージョンで常に動かしておく
      - アプリケーションサーバーなどは、障害時に起動・作成する（AMI や IaC を用意しておく）
      - バックアップと復元より RPO・RTO が短く（数十分程度）、コストは低めに抑えられる
    triggers:
      - データは常に複製しておき、サーバーは障害時に起動する
      - RTO は数十分でよく、コストは抑えたい
    pitfalls:
      - 障害時にサーバーを起動するので、すぐにフルの規模では処理できない
    relations:
      - type: confused_with
        target: patterns-warm-standby
        distinction: パイロットライトはデータの複製など中核だけが動いていて、アプリのサーバーは障害時に起動する。ウォームスタンバイは小さい規模で全体が動いていて、障害時に規模を拡大するだけ
    examDomains: [resilient, cost]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html

  - id: patterns-warm-standby
    category: dr
    concept: ウォームスタンバイ
    summary: 縮小した規模で、システム全体を DR リージョンで常に動かしておき、障害時に規模を拡大する
    facts:
      - 本番より小さい規模で、システム全体を DR リージョンで常に稼働させておく
      - 障害時は、トラフィックを切り替えて規模を拡大する
      - RTO は数分程度で、パイロットライトより速いがコストは高い
    triggers:
      - 数分で復旧したい
      - 小さな規模で DR 環境を常に動かしておく
    pitfalls:
      - 規模を拡大するまでは、全量のトラフィックを処理しきれないことがある
    relations:
      - type: confused_with
        target: patterns-multi-site
        distinction: ウォームスタンバイは DR 側を縮小した規模で動かし、障害時に拡大する。マルチサイト（アクティブ/アクティブ）は複数のリージョンでフルの規模で動かし、常にトラフィックを処理する
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html

  - id: patterns-multi-site
    category: dr
    concept: マルチサイト（アクティブ/アクティブ）
    summary: 複数のリージョンでフルの規模のシステムを同時に動かし、RPO・RTO をほぼゼロにする
    facts:
      - 複数のリージョンで、本番と同じ規模のシステムが同時にトラフィックを処理する
      - リージョン障害でも、残りのリージョンがすぐに処理を続ける
      - RPO・RTO はほぼゼロだが、コストは最も高い
      - DynamoDB グローバルテーブルや Aurora グローバルデータベース、Route 53、Global Accelerator などを組み合わせる
    triggers:
      - ダウンタイムをほぼゼロにしたい
      - 複数のリージョンで同時に処理する
    pitfalls:
      - 要件がそこまで厳しくないのに選ぶと、コストが過剰になる
    relations: []
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html

  - id: patterns-stateless
    category: design
    concept: ステートレスなアプリケーション
    summary: セッションなどの状態をサーバーの外に置き、どのサーバーでもリクエストを処理できるようにする
    facts:
      - セッションやアップロードしたファイルを、ElastiCache、DynamoDB、S3、EFS などサーバーの外に置く
      - どのサーバーが処理しても同じ結果になるので、自由に台数を増減できる
      - サーバーが故障しても、ほかのサーバーがそのまま処理を引き継げる
    triggers:
      - 水平にスケールさせたい
      - サーバーが減ってもセッションを失わないようにしたい
    pitfalls:
      - サーバーのメモリやローカルディスクに状態を持つと、スケールインや障害で失われる
    relations:
      - type: used_with
        target: elasticache-redis
    examDomains: [resilient, performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_stateless.html

  - id: patterns-loose-coupling
    category: design
    concept: 疎結合
    summary: コンポーネントの間にキューやイベントを挟み、互いの障害や負荷の影響を受けにくくする
    facts:
      - SQS、SNS、EventBridge、Kinesis などを挟み、送る側と受ける側を直接つながないようにする
      - 受ける側が止まったり遅くなったりしても、送る側はそのまま動き続けられる
      - それぞれのコンポーネントを独立してスケール・変更できる
    triggers:
      - 一部の障害がシステム全体に広がらないようにしたい
      - 処理の急増を吸収したい
    pitfalls:
      - コンポーネント同士を同期の API 呼び出しで直接つなぐと、一か所の障害や遅延が全体に広がる
    relations:
      - type: used_with
        target: sqs-standard
    examDomains: [resilient]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_loosely_coupled_system.html

  # --- 追加 ------------------------------------------------------------------

  - id: patterns-idempotency
    category: design
    concept: 冪等性（べきとうせい）
    summary: 同じ処理を何度実行しても、1 回実行したときと同じ結果になるように作る
    facts:
      - SQS 標準キューや非同期の再試行では、同じメッセージが 2 回以上届くことがある
      - 注文 ID などの一意なキーで処理済みかを確認し、二重の処理を防ぐ
      - DynamoDB の条件付き書き込みなどで、処理済みの記録を残せる
    triggers:
      - 同じメッセージが 2 回届いても二重に課金しない
      - 少なくとも 1 回の配信
    pitfalls:
      - 重複が起きないと仮定して作ると、再試行や重複配信で二重に処理される
    relations:
      - type: used_with
        target: sqs-standard
    examDomains: [resilient]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_prevent_interaction_failure_idempotent.html

  - id: patterns-retry-backoff
    category: design
    concept: エクスポネンシャルバックオフとジッター
    summary: 失敗した呼び出しを、待ち時間を指数的に延ばし、ランダムなずれを加えて再試行する
    facts:
      - 一時的なエラー（スロットリングなど）は、少し待って再試行すると成功することが多い
      - 待ち時間を 1 秒、2 秒、4 秒…と延ばす（エクスポネンシャルバックオフ）
      - ランダムなずれ（ジッター）を加え、多数のクライアントが同時に再試行するのを防ぐ
      - AWS SDK には、この再試行の仕組みが組み込まれている
    triggers:
      - 429 やスロットリングのエラー
      - 一時的なエラーからの回復
    pitfalls:
      - 待たずにすぐ再試行を繰り返すと、相手の負荷をさらに上げて障害を広げる
    relations:
      - type: used_with
        target: apigateway-throttling
    examDomains: [resilient]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html

  - id: patterns-shared-responsibility
    category: design
    concept: 責任共有モデル
    summary: AWS はクラウドそのもの（物理・基盤）、利用者はクラウドの中（データ・設定・OS など）のセキュリティに責任を持つ
    facts:
      - AWS は、データセンター、ハードウェア、ネットワーク、仮想化の基盤などを守る
      - 利用者は、データ、IAM、セキュリティグループ、暗号化の設定などに責任を持つ
      - EC2 では OS のパッチも利用者の責任だが、RDS や Lambda などのマネージドサービスでは AWS の範囲が広がる
    triggers:
      - OS のパッチは誰の責任か
      - マネージドサービスで利用者の運用を減らしたい
    pitfalls:
      - マネージドサービスでも、データのアクセス制御や暗号化の設定は利用者の責任
    relations: []
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://aws.amazon.com/compliance/shared-responsibility-model/

  - id: patterns-well-architected
    category: design
    concept: AWS Well-Architected フレームワーク
    summary: 運用上の優秀性・セキュリティ・信頼性・パフォーマンス効率・コスト最適化・持続可能性の 6 つの柱で設計を評価する
    facts:
      - 6 つの柱は、運用上の優秀性、セキュリティ、信頼性、パフォーマンス効率、コスト最適化、持続可能性
      - Well-Architected Tool で、ワークロードを質問に沿って評価し、改善点を見つけられる
    triggers:
      - アーキテクチャをベストプラクティスで評価したい
      - 設計のリスクを洗い出したい
    pitfalls:
      - 1 つの柱だけを最適化すると、ほかの柱（例：コストと信頼性）とのトレードオフを見落とす
    relations: []
    examDomains: [resilient, secure, performance, cost]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html

  - id: patterns-multi-az
    category: design
    concept: マルチ AZ による冗長化
    summary: 1 つの AZ の障害に備え、同じ役割のリソースを 2 つ以上の AZ に分けて置く
    facts:
      - AZ は互いに独立した電源・ネットワークを持つデータセンターの集まり
      - EC2 は複数 AZ の Auto Scaling と ELB、DB はマルチ AZ 配置で冗長化する
      - NAT ゲートウェイなど AZ に属するリソースは、AZ ごとに置く
      - S3、DynamoDB、SQS などのリージョンのサービスは、自動で複数の AZ にデータを保存する
    triggers:
      - 1 つの AZ が止まっても動き続けたい
      - 高可用性
    pitfalls:
      - 1 つの AZ にすべてを置くと、その AZ の障害でシステム全体が止まる
    relations:
      - type: used_with
        target: autoscaling-group
      - type: used_with
        target: rds-multi-az
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/use-fault-isolation-to-protect-your-workload.html
