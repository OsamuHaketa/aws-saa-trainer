# CloudFront / Global Accelerator Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: cloudfront

atoms:
  - id: cloudfront-distribution
    category: caching
    concept: Amazon CloudFront
    summary: 世界中のエッジロケーションでコンテンツをキャッシュして、低レイテンシで配信する CDN
    facts:
      - 世界中のエッジロケーションでコンテンツをキャッシュし、ユーザーの近くから配信する
      - オリジン（S3、ALB、EC2、任意の HTTP サーバー）の負荷を減らせる
      - HTTPS の配信、AWS WAF や Shield との連携ができる
      - 静的コンテンツだけでなく、動的コンテンツや API の配信も高速化できる
    triggers:
      - 世界中のユーザーに静的コンテンツを低レイテンシで配信したい
      - オリジンの負荷を減らしたい
      - グローバル
      - キャッシュ
    pitfalls:
      - HTTP 以外の TCP/UDP の通信（ゲームや VoIP など）の高速化には使えない。Global Accelerator を使う
    relations:
      - type: confused_with
        target: globalaccelerator-accelerator
        distinction: CloudFront はエッジでコンテンツをキャッシュして HTTP(S) を配信する。Global Accelerator はキャッシュせず、固定のエニーキャスト IP で TCP/UDP の通信を AWS のネットワーク経由で最適なリージョンへ届ける
    examDomains: [performance]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html

  - id: cloudfront-signed-urls
    category: edge-security
    concept: CloudFront 署名付き URL / 署名付き Cookie
    summary: CloudFront で配信する有料・限定のコンテンツに、期限付きのアクセスを与える
    facts:
      - 署名付き URL は、1 つのファイルごとにアクセスを許可する
      - 署名付き Cookie は、URL を変えずに複数のファイル（会員向けエリア全体など）へのアクセスを許可する
      - 有効期限や、アクセス元の IP アドレスを制限できる
    triggers:
      - 有料会員だけに動画を配信したい
      - CloudFront で限定公開のコンテンツを配信する
      - 複数のファイルへのアクセスをまとめて許可したい
    pitfalls:
      - CloudFront で配信しているのに S3 の署名付き URL を使うと、CloudFront を経由せずキャッシュも効かない
    relations:
      - type: confused_with
        target: s3-presigned-url
        distinction: CloudFront の署名付き URL は CloudFront 経由の配信に使い、キャッシュも効く。S3 の署名付き URL は S3 に直接アクセスさせるもので、アップロードにも使える
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PrivateContent.html

  - id: cloudfront-invalidation
    category: caching
    concept: キャッシュの無効化（Invalidation）
    summary: TTL の期限前に、エッジにキャッシュされたファイルを削除して最新のものを配信させる
    facts:
      - 指定したパスのキャッシュをエッジから削除し、次のリクエストでオリジンから取り直させる
      - TTL の期限を待たずに、更新したファイルを配信できる
      - ファイル名にバージョンを付ける方法（app.v2.js など）なら、無効化をせずに新しいファイルを配信できる
    triggers:
      - 更新したファイルがすぐに反映されない
      - キャッシュを今すぐ消したい
    pitfalls:
      - 頻繁に大量のパスを無効化すると料金がかかる。ファイル名のバージョニングも検討する
    relations: []
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html

  - id: cloudfront-geo-restriction
    category: edge-security
    concept: CloudFront の地域制限
    summary: 国単位で、コンテンツの配信を許可・拒否する
    facts:
      - 許可する国のリスト、または拒否する国のリストを設定する
      - ライセンスの都合で、特定の国にだけ配信したいときに使う
    triggers:
      - 特定の国からのアクセスを禁止したい
      - 配信権の都合で国を限定したい
    pitfalls:
      - DNS でユーザーの地域ごとに振り分けたいだけなら、Route 53 の位置情報ルーティングを使う
    relations:
      - type: confused_with
        target: route53-geolocation
        distinction: CloudFront の地域制限は国単位でコンテンツの配信を拒否する。Route 53 の位置情報ルーティングは、ユーザーの地域ごとに別の宛先へ振り分ける
    examDomains: [secure]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html

  - id: cloudfront-origin-failover
    category: availability
    concept: オリジンフェイルオーバー（オリジングループ）
    summary: プライマリのオリジンがエラーを返したら、セカンダリのオリジンから配信する
    facts:
      - プライマリとセカンダリのオリジンをまとめたオリジングループを作る
      - プライマリが特定の HTTP ステータスコード（500 系など）を返すと、セカンダリに切り替える
      - 別リージョンの S3 バケットをセカンダリにすると、リージョン障害に備えられる
    triggers:
      - オリジンの障害時も配信を続けたい
      - 別リージョンのバケットに自動で切り替えたい
    pitfalls:
      - オリジンが 1 つだけだと、オリジンの障害でキャッシュにないコンテンツが配信できなくなる
    relations: []
    examDomains: [resilient]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html

  - id: cloudfront-functions
    category: caching
    concept: CloudFront Functions / Lambda@Edge
    summary: エッジでリクエストやレスポンスを加工するコードを実行する
    facts:
      - CloudFront Functions は軽量な JavaScript で、ヘッダーの操作や URL の書き換えなどを大量・低コストで実行する
      - Lambda@Edge は Node.js や Python で、より重い処理や外部へのネットワークアクセスができる
      - どちらもユーザーに近いエッジで実行されるので、オリジンまで行かずに処理できる
    triggers:
      - エッジでヘッダーを追加したい
      - URL をリダイレクト・書き換えたい
      - エッジで簡単な認証をしたい
    pitfalls:
      - 単純なヘッダーの操作に Lambda@Edge を使うと、CloudFront Functions より高くつく
    relations: []
    examDomains: [performance]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions.html

  # --- 追加 ------------------------------------------------------------------

  - id: cloudfront-cache-key
    category: caching
    concept: キャッシュキーとキャッシュポリシー
    summary: キャッシュを区別する要素（パス、クエリ文字列、ヘッダー、Cookie）と TTL を決め、キャッシュヒット率を左右する
    facts:
      - キャッシュキーに含めた要素ごとに、別々のキャッシュが作られる
      - 不要なヘッダーや Cookie、クエリ文字列をキャッシュキーに含めると、キャッシュヒット率が下がる
      - キャッシュポリシーで、キャッシュキーと TTL（最小・最大・デフォルト）を設定する
      - オリジンには送りたいがキャッシュキーには含めない値は、オリジンリクエストポリシーで送る
    triggers:
      - キャッシュヒット率が低い
      - オリジンへのリクエストが減らない
    pitfalls:
      - すべてのヘッダーや Cookie をキャッシュキーに含めると、ほとんどキャッシュされなくなる
    relations:
      - type: part_of
        target: cloudfront-distribution
    examDomains: [performance, cost]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-the-cache-key.html

  - id: cloudfront-viewer-https
    category: edge-security
    concept: CloudFront の HTTPS（ビューワープロトコルポリシーと証明書）
    summary: ビューワーとの通信を HTTPS に強制し、独自ドメインの証明書は米国東部（バージニア北部）の ACM で発行する
    facts:
      - ビューワープロトコルポリシーで「HTTP を HTTPS にリダイレクト」や「HTTPS のみ」を選べる
      - 独自ドメインの証明書は、米国東部（バージニア北部、us-east-1）リージョンの ACM で発行・インポートする必要がある
      - オリジンへの通信（オリジンプロトコルポリシー）も HTTPS にできる
    triggers:
      - CloudFront で独自ドメインを HTTPS 化したい
      - HTTP のアクセスを HTTPS に切り替えたい
    pitfalls:
      - 東京リージョンの ACM で作った証明書は、CloudFront に付けられない
    relations:
      - type: used_with
        target: elb-tls-termination
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html

  - id: cloudfront-alb-origin
    category: edge-security
    concept: ALB オリジンへの直接アクセスの制限
    summary: CloudFront を経由しない ALB への直接アクセスを、マネージドプレフィックスリストやカスタムヘッダーで防ぐ
    facts:
      - ALB のセキュリティグループで、CloudFront のマネージドプレフィックスリストからの通信だけを許可できる
      - CloudFront からオリジンに秘密の値のカスタムヘッダーを付け、ALB のリスナールールで確認する方法もある
      - CloudFront の VPC オリジンを使うと、プライベートサブネットの ALB や EC2 をオリジンにできる
      - WAF を CloudFront に付けても、ALB に直接来た通信は検査されない
    triggers:
      - CloudFront を経由しないアクセスを防ぎたい
      - ALB に直接アクセスされて WAF をすり抜けられる
    pitfalls:
      - ALB を 0.0.0.0/0 に公開したままだと、CloudFront と WAF を迂回される
    relations:
      - type: used_with
        target: waf-web-acl
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/restrict-access-to-load-balancer.html
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html

  - id: cloudfront-price-class
    category: caching
    concept: CloudFront の価格クラス
    summary: 配信に使うエッジロケーションの地域を絞り、料金を下げる
    facts:
      - 価格クラス All はすべてのエッジロケーションを使い、性能が最も良い
      - 価格クラス 100 や 200 は、料金の高い地域のエッジロケーションを使わず、コストを下げる
      - 使わない地域のユーザーも、別の地域のエッジから配信される（レイテンシは上がる）
    triggers:
      - CloudFront の料金を下げたい
      - ユーザーが特定の地域（北米・欧州など）に集中している
    pitfalls:
      - 世界中で低レイテンシが必要なのに価格クラスを絞ると、一部の地域で遅くなる
    relations:
      - type: part_of
        target: cloudfront-distribution
    examDomains: [cost]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PriceClass.html
