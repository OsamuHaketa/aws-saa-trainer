# Systems Manager Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: ssm

atoms:
  - id: ssm-parameter-store
    category: secrets
    concept: Systems Manager Parameter Store
    summary: 設定値や秘密情報を階層的に保管する。標準のパラメータは無料
    facts:
      - 設定値や秘密情報を、/prod/db/url のような階層で保管する
      - SecureString で、KMS の鍵を使って暗号化して保管できる
      - 標準のパラメータは無料
      - 自動ローテーションの仕組みはない
    triggers:
      - アプリの設定値を一元管理したい
      - 安く設定値を保管したい
    pitfalls:
      - DB のパスワードの自動ローテーションが必要なら Secrets Manager を使う
    relations: []
    examDomains: [secure, cost]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html

  - id: ssm-session-manager
    category: operations
    concept: Systems Manager Session Manager
    summary: SSH のポートを開けず、踏み台も使わずに、インスタンスにシェルで接続する
    facts:
      - 受信のポート（22 番など）を開けずに、ブラウザや CLI からインスタンスに接続できる
      - 踏み台サーバーや SSH キーの管理が不要になる
      - 接続は IAM で制御し、操作のログを S3 や CloudWatch Logs に残せる
    triggers:
      - SSH のポートを開けたくない
      - 踏み台サーバーをなくしたい
      - 接続の操作ログを残したい
    pitfalls:
      - 踏み台サーバーで SSH を開放し続けると、攻撃を受ける入口が残る
    relations:
      - type: confused_with
        target: vpc-bastion-host
        distinction: 踏み台サーバーは SSH のポートを開けて、そこを経由して接続する。Session Manager はポートを開けず、IAM で制御して接続し、操作ログも残せる
    examDomains: [secure]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html

  - id: ssm-patch-manager
    category: operations
    concept: Systems Manager Patch Manager
    summary: パッチベースラインとメンテナンスウィンドウで、多数のインスタンスへの OS のパッチ適用を自動化する
    facts:
      - パッチベースラインで、どのパッチを承認するかを決める
      - メンテナンスウィンドウで、決まった時間帯にパッチの確認と適用を実行する
      - EC2 とオンプレミスのサーバーの両方を対象にでき、準拠状況を確認できる
    triggers:
      - 数百台のサーバーに OS のパッチを定期的に当てたい
      - パッチの適用状況を一覧したい
    pitfalls:
      - 各サーバーに SSH して手動でパッチを当てると、漏れや作業の手間が大きい
    relations:
      - type: used_with
        target: ssm-run-command
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager.html

  - id: ssm-run-command
    category: operations
    concept: Systems Manager Run Command
    summary: SSH を使わずに、多数のインスタンスへ同じコマンドやスクリプトを一斉に実行する
    facts:
      - タグなどで対象を選び、多数のインスタンスに同時にコマンドを実行する
      - SSH のポートや踏み台は不要で、IAM で実行できる人を制御する
      - 実行の結果は S3 や CloudWatch Logs に残せる
    triggers:
      - 100 台のサーバーで同じコマンドを実行したい
      - SSH なしでスクリプトを実行したい
    pitfalls:
      - 対話的にシェルで操作したいなら Session Manager を使う
    relations:
      - type: confused_with
        target: ssm-session-manager
        distinction: Run Command は多数のインスタンスにコマンドを一括で実行する。Session Manager は 1 台のインスタンスに対話的なシェルで接続する
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/run-command.html
