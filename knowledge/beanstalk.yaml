# Elastic Beanstalk Knowledge Atoms
service: beanstalk

atoms:
  - id: beanstalk-environment
    category: compute
    concept: AWS Elastic Beanstalk
    summary: コードをアップロードするだけで、ロードバランサーや Auto Scaling を含む実行環境を自動で作る
    facts:
      - アプリのコードをアップロードすると、EC2、ELB、Auto Scaling、監視を自動で構成する
      - Java、Python、Node.js、.NET、Docker などに対応する
      - 作られたリソースは自分のアカウントにあり、必要なら細かく設定を変えられる
    triggers:
      - インフラの知識が少なくても、Web アプリをすぐにデプロイしたい
      - 開発者がコードだけに集中したい
    pitfalls:
      - 細かいインフラの構成を自分で設計したい場合は、CloudFormation などで個別に構築する
    relations: []
    examDomains: [performance]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html

  - id: beanstalk-deployment-policies
    category: compute
    concept: Elastic Beanstalk のデプロイ方式
    summary: 一度に全台、ローリング、追加バッチ付きローリング、イミュータブル、トラフィック分割、ブルー/グリーンから選ぶ
    facts:
      - 一度に全台（All at once）は最も速いが、デプロイ中に停止する
      - ローリングは少しずつ更新するが、その間は処理能力が下がる。追加バッチ付きなら能力を保てる
      - イミュータブルは新しいインスタンス群を作って切り替え、失敗しても元の環境に影響しない
      - ブルー/グリーンは別の環境を作り、URL（CNAME）の入れ替えで切り替える
    triggers:
      - デプロイ中も処理能力を落としたくない
      - デプロイに失敗してもすぐ元に戻したい
    pitfalls:
      - 本番で一度に全台を使うと、デプロイ中にサービスが止まる
    relations:
      - type: part_of
        target: beanstalk-environment
    examDomains: [resilient]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
