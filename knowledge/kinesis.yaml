# Kinesis Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: kinesis

atoms:
  - id: kinesis-data-streams
    category: streaming
    concept: Kinesis Data Streams
    summary: 大量のストリーミングデータをリアルタイムに取り込み、複数の処理側が順序どおりに読める
    facts:
      - クリックストリーム、ログ、IoT などの大量のデータをリアルタイムに取り込む
      - データはシャードに分かれ、同じパーティションキーのデータは順序が保たれる
      - データはデフォルト 24 時間、最大 365 日保持され、複数の処理側が同じデータを読んだり、読み直したりできる
      - 容量はオンデマンドか、シャード数を指定するプロビジョンドで決める
    triggers:
      - リアルタイムのストリーミングデータ
      - 同じデータを複数のアプリで処理したい
      - データを後から読み直したい（リプレイ）
      - クリックストリーム
    pitfalls:
      - 単に S3 などにデータを届けたいだけなら、Data Firehose の方が管理が少ない
    relations:
      - type: confused_with
        target: sqs-standard
        distinction: Kinesis Data Streams はデータを保持して、複数の処理側が順序どおりに読み、読み直すこともできる。SQS はメッセージを 1 つの処理側が処理したら削除し、読み直しはしない
      - type: confused_with
        target: kinesis-firehose
        distinction: Data Streams はリアルタイムに取り込み、自分で処理側を作る（保持・リプレイあり）。Firehose は S3 や Redshift などに自動で届ける配信サービスで、処理側の管理が不要だが、保持やリプレイはない
    examDomains: [performance]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/streams/latest/dev/introduction.html

  - id: kinesis-firehose
    category: streaming
    concept: Amazon Data Firehose
    summary: ストリーミングデータを、S3・Redshift・OpenSearch などに自動でまとめて届ける
    facts:
      - ストリーミングデータを S3、Redshift、OpenSearch、Splunk などに自動で届ける
      - フルマネージドで、処理側のアプリやシャードの管理が不要
      - データをバッファしてから届けるので、ほぼリアルタイム（数秒〜数分の遅延）
      - Lambda での変換や、Parquet 形式への変換ができる
    triggers:
      - ストリーミングデータを S3 に保存したい
      - 管理なしにログを Redshift や OpenSearch に届けたい
      - ほぼリアルタイム
    pitfalls:
      - ミリ秒単位のリアルタイム処理や、データの読み直しが必要なら Data Streams を使う
    relations: []
    examDomains: [performance]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html

  # --- 追加 ------------------------------------------------------------------

  - id: kinesis-shards
    category: streaming
    concept: Kinesis Data Streams のシャードとキャパシティモード
    summary: シャード 1 つで書き込み 1 MB/秒または 1,000 レコード/秒。オンデマンドモードならシャードの管理が不要
    facts:
      - 1 シャードあたり、書き込みは 1 MB/秒または 1,000 レコード/秒、読み取りは 2 MB/秒
      - パーティションキーで、レコードがどのシャードに入るかが決まり、シャード内で順序が保たれる
      - プロビジョンドモードではシャード数を自分で決め、オンデマンドモードでは自動で調整される
      - データの保持期間はデフォルト 24 時間で、最大 365 日まで延ばせる
    triggers:
      - 書き込みが ProvisionedThroughputExceeded で失敗する
      - ストリームのスループットを上げたい
    pitfalls:
      - 特定のパーティションキーに書き込みが集中すると、1 つのシャードだけが上限に達する
    relations:
      - type: part_of
        target: kinesis-data-streams
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
      - https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html

  - id: kinesis-flink
    category: streaming
    concept: Amazon Managed Service for Apache Flink
    summary: ストリーミングデータを Apache Flink（SQL・Java など）でリアルタイムに集計・分析する
    facts:
      - Kinesis Data Streams や MSK のデータを、リアルタイムに集計・変換・分析する
      - サーバーの管理は不要で、Apache Flink のアプリを動かす
      - 時間の窓（直近 5 分など）での集計や、異常の検出に使う
    triggers:
      - ストリームのデータを直近 1 分ごとにリアルタイムに集計したい
      - ストリーミングデータに SQL で分析をかけたい
    pitfalls:
      - S3 に保存したデータをあとから分析するだけなら、Athena などで足りる
    relations:
      - type: used_with
        target: kinesis-data-streams
    examDomains: [performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html
