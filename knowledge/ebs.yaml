# EBS Knowledge Atoms
# スキーマ: lib/schema/atom.ts / 検証: npm run validate

service: ebs

atoms:
  - id: ebs-gp3
    category: block-storage
    concept: 汎用 SSD（gp3）
    summary: 容量に関係なく IOPS とスループットを設定できる、汎用の SSD ボリューム
    facts:
      - 容量に関係なく、ベースラインで 3,000 IOPS と 125 MB/秒を持つ
      - IOPS とスループットを、容量とは別に追加で設定できる
      - gp2 より安く、多くのワークロードの標準の選択肢
      - ブートボリュームに使える
      - 上限は 80,000 IOPS・2,000 MiB/秒・64 TiB（2025 年 9 月に 16,000 IOPS・1,000 MiB/秒・16 TiB から拡大）
    triggers:
      - 一般的なアプリや開発環境のボリューム
      - IOPS のために容量を増やしたくない
    pitfalls:
      - 非常に高い IOPS と低レイテンシが常に必要な重要な DB には、io2 を使う
    relations:
      - type: confused_with
        target: ebs-io2
        distinction: gp3 は汎用でコスト効率が良い。io2 はプロビジョンド IOPS で、より高い IOPS と耐久性を持ち、ミッションクリティカルな DB 向け
    examDomains: [cost, performance]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
      - https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html

  - id: ebs-io2
    category: block-storage
    concept: プロビジョンド IOPS SSD（io2）
    summary: 高い IOPS を安定して必要とする、重要なデータベース向けの SSD ボリューム
    facts:
      - 必要な IOPS を指定して確保する
      - io2 Block Express では、最大 256,000 IOPS の非常に高い性能を出せる
      - 同じ AZ の複数のインスタンスに同時に接続できる（マルチアタッチ）
      - 耐久性が高い
    triggers:
      - I/O の多いミッションクリティカルな DB
      - 数万 IOPS 以上が安定して必要
    pitfalls:
      - それほど高い IOPS が要らない用途では、gp3 より大幅に高くつく
    relations: []
    examDomains: [performance]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/provisioned-iops.html

  - id: ebs-st1
    category: block-storage
    concept: スループット最適化 HDD（st1）
    summary: 大量のデータを順番に読み書きする処理向けの、低コストの HDD ボリューム
    facts:
      - 大きなデータを連続して読み書きするスループット重視の HDD
      - ビッグデータ、データウェアハウス、ログ処理に向く
      - ブートボリュームには使えない
    triggers:
      - 大量のデータを順番に読む
      - スループット重視で安く
    pitfalls:
      - ランダムな小さい読み書きが多い DB には向かない（SSD を使う）
    relations:
      - type: confused_with
        target: ebs-sc1
        distinction: st1 は頻繁にアクセスするスループット重視のデータ向け。sc1 はほとんどアクセスしないデータ向けで、最も安い
    examDomains: [cost, performance]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html

  - id: ebs-sc1
    category: block-storage
    concept: Cold HDD（sc1）
    summary: アクセスの少ないデータ向けの、最も安い EBS ボリューム
    facts:
      - EBS で最も安いボリュームタイプ
      - アクセスの少ない、大きなデータ向け
      - ブートボリュームには使えない
    triggers:
      - アクセスの少ないデータを最も安く EBS に置きたい
    pitfalls:
      - 性能が必要な処理には向かない
    relations: []
    examDomains: [cost]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/hdd-vols.html

  - id: ebs-snapshots
    category: backup
    concept: EBS スナップショット
    summary: ボリュームの増分バックアップ。別の AZ やリージョンにボリュームを復元できる
    facts:
      - 前回からの変更分だけを保存する増分バックアップ
      - スナップショットから、別の AZ にボリュームを作れる
      - 別のリージョンにコピーでき、別のアカウントと共有できる
      - Data Lifecycle Manager や AWS Backup で、取得と削除を自動化できる
    triggers:
      - EBS のバックアップ
      - 別の AZ やリージョンにボリュームを移したい
      - バックアップを自動化したい
    pitfalls:
      - スナップショットから作ったボリュームは、最初の読み取りが遅いことがある（高速スナップショット復元で解消）
    relations:
      - type: used_with
        target: ec2-ebs-volume
    examDomains: [resilient]
    importance: high
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html

  - id: ebs-encryption
    category: block-storage
    concept: EBS の暗号化
    summary: KMS の鍵でボリュームとスナップショットを暗号化する。リージョンごとにデフォルトで暗号化できる
    facts:
      - KMS の鍵で、ボリューム、スナップショット、インスタンスとの間の通信を暗号化する
      - リージョン単位で「デフォルトで暗号化」を有効にすると、新しいボリュームが自動で暗号化される
      - 暗号化されていないボリュームは、スナップショットを暗号化してコピーし、そこから作り直して暗号化する
      - 暗号化による性能への影響はほとんどない
    triggers:
      - 新しく作るすべての EBS を暗号化したい
      - 既存の暗号化されていないボリュームを暗号化したい
    pitfalls:
      - 既存のボリュームに、直接暗号化を有効にすることはできない
    relations: []
    examDomains: [secure]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html

  # --- 追加 ------------------------------------------------------------------

  - id: ebs-elastic-volumes
    category: block-storage
    concept: Elastic Volumes（稼働中の変更）
    summary: 接続したまま、EBS ボリュームの容量・タイプ・IOPS・スループットを変更する
    facts:
      - インスタンスを止めずに、容量を増やしたり、gp2 から gp3 にタイプを変えたりできる
      - 容量を増やしたあとは、OS 側でファイルシステムを拡張する
      - 容量を減らすことはできない
      - 同じボリュームは 24 時間に 4 回まで変更できる（前の変更が終わっていれば続けて変更できる）
    triggers:
      - 止めずにディスクの容量を増やしたい
      - gp2 から gp3 に移行してコストを下げたい
    pitfalls:
      - 容量を増やすために、スナップショットから新しいボリュームを作り直す必要はない
    relations:
      - type: used_with
        target: ebs-gp3
    examDomains: [performance, cost]
    importance: medium
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html
      - https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ebs-up-to-four-volume-modifications/

  - id: ebs-multi-attach
    category: block-storage
    concept: EBS マルチアタッチ
    summary: io1 / io2 のボリュームを、同じ AZ の複数の Nitro インスタンスに同時に接続する
    facts:
      - プロビジョンド IOPS SSD（io1 / io2）だけが対応する
      - 同じ AZ にある最大 16 台の Nitro ベースのインスタンスに接続できる
      - 同時書き込みを安全に扱うには、クラスター対応のファイルシステムやアプリが必要
    triggers:
      - クラスター化したアプリで、1 つのブロックストレージを複数台から使いたい
      - 同じ AZ の複数台で同じボリュームに書き込みたい
    pitfalls:
      - 複数の AZ や多数のサーバーでファイルを共有したいだけなら、EFS を使う
    relations:
      - type: confused_with
        target: efs-filesystem
        distinction: マルチアタッチは io1 / io2 のブロックストレージを同じ AZ の最大 16 台に付ける（クラスター対応のアプリが必要）。EFS は複数の AZ の多数のインスタンスからマウントできるファイル共有
    examDomains: [resilient]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html

  - id: ebs-recycle-bin
    category: backup
    concept: ゴミ箱（Recycle Bin）
    summary: 誤って削除した EBS スナップショットや AMI を、保持期間内なら元に戻せる
    facts:
      - 保持ルールを作ると、削除されたスナップショットや AMI がゴミ箱に一定期間残る
      - 保持期間内なら復元でき、過ぎると完全に削除される
      - タグやリソースの種類で、対象を絞れる
    triggers:
      - 誤って削除したスナップショットを戻したい
      - スナップショットの誤削除に備えたい
    pitfalls:
      - ゴミ箱の保持ルールは削除の前に作っておく必要がある
    relations:
      - type: used_with
        target: ebs-snapshots
    examDomains: [resilient]
    importance: low
    status: draft
    sources:
      - https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin.html
