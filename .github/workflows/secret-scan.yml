# push のたびに、リポジトリの全履歴に秘密情報がないかを gitleaks で調べる。
# ローカルのフック（.githooks/）を入れていない環境からの push に備えた、最後の検出
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴を調べる

      - name: gitleaks をダウンロードする（チェックサムを確認）
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks

      - name: 全履歴をスキャンする
        run: ./gitleaks git --redact --no-banner --verbose
